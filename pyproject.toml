[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "compact-glycosylation"
version = "0.1.0"
description = "Compact protein representations for glycosyltransferase substrate prediction"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
    "numpy==2.1.3",
    "scipy==1.15.3",
    "scikit-learn==1.6.1",
    "biopython==1.85",
    "joblib>=1.4,<2",
    "threadpoolctl>=3.5,<4",
]

[project.optional-dependencies]
neural = ["torch>=2.7,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
